r id="contact">Contact: <b>@SarkarNoir</b></footer><script>const products=[['Gaming Digital Pack','Gaming','₹99'],['Premium Utility Pack','Utility','₹149'],['Game Setup Service','Gaming','₹199']];function render(){let q=search.value.toLowerCase(),c=cat.value;grid.innerHTML=products.filter(x=>(c==='all'||x[1]===c)&&x[0].toLowerCase().includes(q)).map(x=>`<article class="card"><span class="badge">${x[1]}</span><h3>${x[0]}</h3><p>Legal digital gaming product/service listing.</p><div class="price">${x[2]}</div><button onclick="order('${x[0]}')">BUY NOW</button></article>`).join('')}function order(n){location.href='https://wa.me/9779764747014?text='+encodeURIComponent('Hello, I want to order: '+n)}search.oninput=render;cat.onchange=render;render()</script></body></html>
